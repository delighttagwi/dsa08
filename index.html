<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloads</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, Arial, sans-serif; background: #f4f6f8; color: #1d2733; padding: 24px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; }
  .btn { display: inline-block; padding: 8px 14px; border-radius: 6px; border: 1px solid #2563eb; background: #2563eb; color: #fff; text-decoration: none; font-size: 14px; cursor: pointer; }
  .btn.alt { background: #fff; color: #2563eb; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card { background: #fff; border: 1px solid #dde3ea; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .badge { min-width: 46px; text-align: center; padding: 6px 0; border-radius: 6px; font-size: 12px; font-weight: 700; color: #fff; background: #64748b; }
  .badge.pdf { background: #dc2626; } .badge.js, .badge.pts { background: #ca8a04; }
  .badge.py, .badge.java { background: #16a34a; } .badge.docx { background: #2563eb; }
  .badge.xlsx { background: #15803d; } .badge.zip { background: #7c3aed; }
  .name { font-size: 14px; font-weight: 600; word-break: break-all; }
  .path { font-size: 12px; color: #64748b; word-break: break-all; }
  .actions { display: flex; gap: 8px; }
  #preview { margin-top: 24px; background: #fff; border: 1px solid #dde3ea; border-radius: 10px; overflow: hidden; display: none; }
  #preview .bar { display: flex; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #dde3ea; font-size: 14px; }
  #preview iframe { width: 100%; height: 75vh; border: none; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Downloads</h1>
    <button class="btn" id="all">Download all (11)</button>
  </header>

  <div class="grid" id="grid"></div>

  <div id="preview">
    <div class="bar"><span id="pname"></span><a href="#" id="pclose">Close</a></div>
    <iframe id="frame" title="PDF Preview"></iframe>
  </div>
</div>

<script>
/* ====== EDIT THIS LIST ======
   Put your 11 files in the same folder as this index.html (the root folder),
   then set each src to the file name or path, e.g. "3.pdf" or "files/code.py".
   Any file type works. Add a title if you want a friendlier name. */
const FILES = [
  { title: "Lab Manual",          src: "3" },
  { title: "Experiment 1 PDF",    src: "1.pdf" },
  { title: "Experiment 2 PDF",    src: "2.pdf" },
  { title: "Experiment 3 PDF",    src: "3.pdf" },
  { title: "Packet Tracer Exp 3", src: "builder3.pts" },
  { title: "Packet Tracer Exp 4", src: "builder4.pts" },
  { title: "Packet Tracer Exp 5", src: "builder5.pts" },
  { title: "Packet Tracer Exp 6", src: "builder6.pts" },
  { title: "UDP Server",          src: "udp_server.py" },
  { title: "UDP Client",          src: "udp_client.py" },
  { title: "Combined Script",     src: "packet_tracer_experiments.js" }
];

const grid = document.getElementById("grid");
const ext = s => (s.split(".").pop() || "").toLowerCase();
const fname = s => s.split("/").pop();

FILES.forEach(f => {
  const e = ext(f.src);
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="top"><div class="badge ' + e + '">.' + e.toUpperCase() + '</div>' +
    '<div><div class="name"></div><div class="path"></div></div></div>' +
    '<div class="actions"></div>';
  card.querySelector(".name").textContent = f.title || fname(f.src);
  card.querySelector(".path").textContent = f.src;

  const dl = document.createElement("a");
  dl.className = "btn dl";
  dl.href = f.src;
  dl.setAttribute("download", fname(f.src));
  dl.textContent = "Download";
  card.querySelector(".actions").appendChild(dl);

  if (e === "pdf") {
    const pv = document.createElement("a");
    pv.className = "btn alt";
    pv.href = "#";
    pv.textContent = "Preview";
    pv.onclick = ev => { ev.preventDefault(); showPreview(f); };
    card.querySelector(".actions").appendChild(pv);
  }
  grid.appendChild(card);
});

function showPreview(f) {
  document.getElementById("pname").textContent = f.title || fname(f.src);
  document.getElementById("frame").src = f.src + "#view=FitH";
  document.getElementById("preview").style.display = "block";
  document.getElementById("preview").scrollIntoView({ behavior: "smooth" });
}
document.getElementById("pclose").onclick = e => {
  e.preventDefault();
  document.getElementById("preview").style.display = "none";
  document.getElementById("frame").src = "about:blank";
};

// Download all: clicks each link with a short delay (browser may ask to allow multiple downloads)
document.getElementById("all").onclick = () => {
  document.querySelectorAll("a.dl").forEach((a, i) => setTimeout(() => a.click(), i * 600));
};
</script>
</body>
</html>
